name: Solicitação de Funcionalidade
description: Sugira uma nova funcionalidade ou melhoria para o Project NOMAD
title: "[Feature]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo seu interesse em melhorar o Project NOMAD! Antes de enviar uma solicitação de funcionalidade, considere consultar nosso [roadmap](https://roadmap.projectnomad.us) para verificar se ela já está planejada ou em desenvolvimento. Você também pode sugerir novas ideias por lá caso não pretenda abrir PRs por conta própria.

        **Observação:** As solicitações de funcionalidades não têm garantia de implementação. Todas as solicitações são avaliadas com base no alinhamento com os objetivos do projeto, viabilidade e demanda da comunidade.

        **Antes de enviar:**
        - Pesquise solicitações de funcionalidades existentes e nosso [roadmap](https://roadmap.projectnomad.us) para evitar duplicatas
        - Considere se isso está alinhado com a missão do NOMAD: conhecimento e educação com foco em funcionamento offline
        - Considere a viabilidade técnica da funcionalidade: o NOMAD foi projetado para ser executado em containers e funcionar em uma ampla variedade de hardware, portanto, funcionalidades que exigem muitos recursos (exceto tarefas que utilizam intensivamente a GPU) ou configurações complexas do sistema podem ter menor probabilidade de serem implementadas
        - Considere o escopo da funcionalidade: melhorias pequenas e focadas, que possam ser implementadas de forma incremental, têm maior probabilidade de serem implementadas do que funcionalidades grandes e abrangentes que exigiriam um esforço significativo de desenvolvimento ou que não tenham um caminho claro para implementação
        - Se você puder contribuir com código, testes ou documentação, isso aumenta significativamente as chances de sua funcionalidade ser implementada

  - type: dropdown
    id: feature-category
    attributes:
      label: Categoria da Funcionalidade
      description: A qual área esta funcionalidade está relacionada?
      options:
        - Nova Integração de Serviço/Ferramenta
        - Melhoria do Assistente de IA
        - Melhoria da Base de Conhecimento/RAG
        - Gerenciamento de Conteúdo (ZIM, Mapas, Coleções)
        - Melhoria da Interface/UX
        - Gerenciamento do Sistema
        - Otimização de Desempenho
        - Documentação
        - Segurança
        - Outro
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Descrição do Problema
      description: Qual problema esta funcionalidade resolve? Sua solicitação está relacionada a alguma dificuldade específica?
      placeholder: Acho frustrante quando... / Seria útil se... / Os usuários têm dificuldade com...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solução Proposta
      description: Descreva a funcionalidade ou melhoria que você gostaria de ver
      placeholder: Adicionar uma funcionalidade que... / Alterar o comportamento para... / Integrar com...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Soluções Alternativas
      description: Você considerou alguma solução alternativa ou forma de contornar o problema?
      placeholder: Eu tentei... / Outra abordagem poderia ser... / Uma alternativa seria...

  - type: textarea
    id: use-case
    attributes:
      label: Caso de Uso
      description: Descreva um cenário específico em que esta funcionalidade seria útil
      placeholder: |
        Como um [tipo de usuário], quando eu [faço algo], quero [realizar algo] para que [benefício].

        Exemplo: Como tenho uma GPU dedicada, quero poder ver na interface se o suporte à GPU está ativado para que eu possa otimizar o desempenho e solucionar problemas com mais facilidade.

  - type: dropdown
    id: user-type
    attributes:
      label: Quem se beneficiaria desta funcionalidade?
      description: Que tipo de usuário consideraria esta funcionalidade mais útil?
      multiple: true
      options:
        - Usuários Individuais/Domésticos
        - Famílias
        - Professores/Educadores
        - Estudantes
        - Sobrevivencialistas/Preppers
        - Desenvolvedores/Colaboradores
        - Organizações
        - Todos os Usuários
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Qual a importância desta funcionalidade para você?
      options:
        - Crítica - Impede meu uso do NOMAD
        - Alta - Melhoraria significativamente minha experiência
        - Média - Seria bom ter
        - Baixa - Pequena conveniência
    validations:
      required: true

  - type: textarea
    id: implementation-ideas
    attributes:
      label: Ideias de Implementação (Opcional)
      description: Se você tiver sugestões técnicas de como isso poderia ser implementado, compartilhe-as aqui
      placeholder: Isso poderia utilizar... / Poderia ser integrado com... / Uma possível abordagem seria...

  - type: textarea
    id: examples
    attributes:
      label: Exemplos ou Referências
      description: Existem funcionalidades semelhantes em outros aplicativos? Inclua links, capturas de tela ou descrições
      placeholder: Semelhante à forma como o [nome do aplicativo] faz... / Veja este exemplo em [URL]

  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: Você estaria disposto a ajudar a implementar isso?
      description: Contribuir aumenta a probabilidade de implementação
      options:
        - "Sim - Posso escrever o código"
        - "Sim - Posso ajudar nos testes"
        - "Sim - Posso ajudar com a documentação"
        - "Talvez - Com orientação"
        - "Não - Não tenho as habilidades/tempo necessários"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Contexto Adicional
      description: Adicione qualquer outro contexto, protótipos, diagramas ou informações sobre a solicitação de funcionalidade

  - type: checkboxes
    id: checklist
    attributes:
      label: Lista de Verificação Antes do Envio
      description: Confirme os itens abaixo antes de enviar
      options:
        - label: Pesquisei solicitações de funcionalidades existentes que possam ser semelhantes
          required: true
        - label: Esta funcionalidade está alinhada com a missão do NOMAD de oferecer conhecimento e educação com foco em funcionamento offline
          required: true
        - label: Entendo que as solicitações de funcionalidades não têm garantia de implementação
          required: true
