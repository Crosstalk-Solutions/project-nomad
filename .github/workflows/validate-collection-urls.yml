name: Validate Collection URLs

on:
  push:
    paths:
      - 'collections/**.json'
  pull_request:
    paths:
      - 'collections/**.json'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  validate-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Scheduled runs open (or update) a tracking issue when URLs break, so a
      # failure on main reaches triage instead of sitting in the Actions tab.
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract and validate URLs
        run: |
          FAILED=0
          CHECKED=0
          FAILED_URLS=""

          # Recursively extract all non-null string URLs from every JSON file in collections/
          URLS=$(jq -r '.. | .url? | select(type == "string")' collections/*.json | sort -u)

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            CHECKED=$((CHECKED + 1))
            printf "Checking: %s ... " "$url"

            # HEAD transfers no body at all, so nothing is downloaded even when a
            # server ignores Range headers. curl can still exit non-zero (DNS,
            # TLS, timeout), so capture the status without letting `set -e`
            # (bash -e) kill the whole step mid-loop.
            METHOD="HEAD"
            CURL_EXIT=0
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --head \
              --max-time 30 \
              --retry 2 \
              --retry-delay 2 \
              --location \
              "$url") || CURL_EXIT=$?

            # Some servers refuse HEAD outright. Fall back to a single-byte
            # ranged GET for those. --max-filesize caps the damage if the server
            # ignores the Range header, but has to stay comfortably above a
            # redirect body: --location applies the limit to the 3xx body too,
            # and a cap below that aborts on the redirect itself.
            case "$HTTP_CODE" in
              403|405|501)
                METHOD="GET"
                CURL_EXIT=0
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --range 0-0 \
                  --max-filesize 8192 \
                  --max-time 30 \
                  --retry 2 \
                  --retry-delay 2 \
                  --location \
                  "$url") || CURL_EXIT=$?
                ;;
            esac

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "206" ]; then
              echo "OK ($HTTP_CODE via $METHOD)"
            else
              echo "FAILED (HTTP $HTTP_CODE via $METHOD, curl exit $CURL_EXIT)"
              FAILED=$((FAILED + 1))
              FAILED_URLS="$FAILED_URLS\n  - $url (HTTP $HTTP_CODE via $METHOD, curl exit $CURL_EXIT)"
            fi
          done <<< "$URLS"

          echo ""
          echo "Checked $CHECKED URLs, $FAILED failed."

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "Broken URLs:"
            printf "%b\n" "$FAILED_URLS"
            printf "%b\n" "$FAILED_URLS" | sed '/^$/d' > broken-urls.txt
            exit 1
          fi

      # Only for runs against main itself (schedule / manual), never PRs or pushes:
      # a PR that breaks a URL already shows a red check on the PR.
      - name: Open or update the tracking issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Catalog URLs failing on main'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s broken-urls.txt ] || echo "  - (no URL list captured; see the run log)" > broken-urls.txt
          {
            echo "The weekly catalog URL check failed on \`main\` ($(date -u +%Y-%m-%d))."
            echo ""
            echo "Broken URLs:"
            cat broken-urls.txt
            echo ""
            echo "A date-only change usually self-heals at download time. A 404 whose id no longer"
            echo "exists upstream (a rename) does not, and needs a catalog fix. Run: $RUN_URL"
          } > body.md
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi

      - name: Close the tracking issue once URLs pass
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Catalog URLs failing on main'
        run: |
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "All catalog URLs pass again as of $(date -u +%Y-%m-%d)."
          fi
