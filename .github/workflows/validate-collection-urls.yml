
name: Validar URLs das coleções

on:
  push:
    paths:
      - 'collections/**.json'
  pull_request:
    paths:
      - 'collections/**.json'

jobs:
  validate-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extrair e validar URLs
        run: |
          FAILED=0
          CHECKED=0
          FAILED_URLS=""

          # Extrai recursivamente todas as URLs em formato de string
          # não nulas de cada arquivo JSON em collections/.
          URLS=$(jq -r '.. | .url? | select(type == "string")' collections/*.json | sort -u)

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            CHECKED=$((CHECKED + 1))
            printf "Verificando: %s ... " "$url"

            # HEAD não transfere o corpo da resposta.
            # O curl pode retornar um código diferente de zero em casos
            # de falha de DNS, TLS ou tempo limite. Capturamos esse
            # código para evitar que o bash -e encerre a etapa.
            METHOD="HEAD"
            CURL_EXIT=0
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --head \
              --max-time 30 \
              --retry 2 \
              --retry-delay 2 \
              --location \
              "$url") || CURL_EXIT=$?

            # Alguns servidores recusam requisições HEAD.
            # Nesses casos, tenta uma requisição GET de um único byte.
            # O limite de tamanho reduz o risco de baixar arquivos
            # grandes caso o servidor ignore o cabeçalho Range.
            case "$HTTP_CODE" in
              403|405|501)
                METHOD="GET"
                CURL_EXIT=0
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --range 0-0 \
                  --max-filesize 8192 \
                  --max-time 30 \
                  --retry 2 \
                  --retry-delay 2 \
                  --location \
                  "$url") || CURL_EXIT=$?
                ;;
            esac

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "206" ]; then
              echo "OK ($HTTP_CODE via $METHOD)"
            else
              echo "FALHA (HTTP $HTTP_CODE via $METHOD, código de saída do curl: $CURL_EXIT)"
              FAILED=$((FAILED + 1))
              FAILED_URLS="$FAILED_URLS\n  - $url (HTTP $HTTP_CODE via $METHOD, código de saída do curl: $CURL_EXIT)"
            fi
          done <<< "$URLS"

          echo ""
          echo "Verificadas $CHECKED URLs; $FAILED falharam."

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "URLs com falha:"
            printf "%b\n" "$FAILED_URLS"
            exit 1
          fi
