name: Construir imagem do Sidecar Updater

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão semântica para identificar a imagem Docker (sem o prefixo "v", por exemplo, "1.2.3")'
        required: true
        type: string
      tag_latest:
        description: 'Identificar também esta imagem com a tag :latest?'
        required: false
        type: boolean
        default: false

jobs:
  check_authorization:
    name: Verificar autorização para publicar uma nova imagem Docker
    runs-on: ubuntu-latest
    outputs:
      isAuthorized: ${{ steps.check-auth.outputs.is_authorized }}
    steps:
      - name: Verificar autorização
        id: check-auth
        run: echo "is_authorized=${{ contains(secrets.DEPLOYMENT_AUTHORIZED_USERS, github.triggering_actor) }}" >> $GITHUB_OUTPUT

  build:
    name: Construir imagem do sidecar-updater
    needs: check_authorization
    if: needs.check_authorization.outputs.isAuthorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v5
        with:
          context: install/sidecar-updater
          push: true
          tags: |
            ghcr.io/crosstalk-solutions/project-nomad-sidecar-updater:${{ inputs.version }}
            ghcr.io/crosstalk-solutions/project-nomad-sidecar-updater:v${{ inputs.version }}
            ${{ inputs.tag_latest && 'ghcr.io/crosstalk-solutions/project-nomad-sidecar-updater:latest' || '' }}
